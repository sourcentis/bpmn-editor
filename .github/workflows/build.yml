name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - '**.md'
  pull_request:
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
