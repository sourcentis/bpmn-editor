name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs strictly from package-lock.json against a clean
      # checkout — unlike a local build, it can't accidentally succeed on a
      # file that exists on disk but was never committed.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Structural tests assert on parseBPMN's output data, not screenshots,
      # so they're deterministic across environments — unlike tests/visual,
      # whose baselines are only reproducible in the pinned Docker image
      # from CONTRIBUTING.md and are intentionally not run here.
      - name: Structural tests
        run: npm run test:structural
